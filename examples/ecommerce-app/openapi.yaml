openapi: 3.0.0
info:
  title: CodeBridge E-Commerce Platform API
  description: Core business API for customer authentication, product catalog, and payment processing.
  version: 1.0.0
paths:
  /api/v1/orders/checkout:
    post:
      summary: Initiate customer order checkout and payment charge
      operationId: checkoutOrder
      tags:
        - Financial & Payment Processing
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /api/v1/customers/{customerId}:
    get:
      summary: Retrieve customer account details and order history
      operationId: getCustomerProfile
      tags:
        - Identity & Access Control
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer profile returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

components:
  schemas:
    Customer:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
        email:
          type: string
        fullName:
          type: string
        createdAt:
          type: string

    Order:
      type: object
      required:
        - id
        - customer
        - totalAmount
      properties:
        id:
          type: string
        totalAmount:
          type: number
        status:
          type: string
        customer:
          $ref: '#/components/schemas/Customer'

    CheckoutRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            type: string
